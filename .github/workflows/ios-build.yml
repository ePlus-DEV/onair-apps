name: iOS simulator build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-simulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install app dependencies
        run: npm ci
      - name: Run app checks
        working-directory: frontend
        run: npm run test:app
      - name: Generate app frontend
        env:
          NUXT_PUBLIC_CORS_SERVER_1: ${{ vars.NUXT_PUBLIC_CORS_SERVER_1 }}
          NUXT_PUBLIC_GLOBAL_RADIO_RESOLVER_URL: ${{ vars.NUXT_PUBLIC_GLOBAL_RADIO_RESOLVER_URL }}
          NUXT_PUBLIC_API_ZING_LIVE_STREAM_PROGRAM_DETAIL: ${{ vars.NUXT_PUBLIC_API_ZING_LIVE_STREAM_PROGRAM_DETAIL }}
          NUXT_PUBLIC_API_ZING_GET_LYRIC: ${{ vars.NUXT_PUBLIC_API_ZING_GET_LYRIC }}
        run: npm run sync:web
      - name: Sync iOS and install CocoaPods dependencies
        run: npx cap sync ios
      - name: Build iOS simulator app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/onair-ios" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Launch app on an iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); devices=[x for group in d["devices"].values() for x in group if x["isAvailable"] and x["name"].startswith("iPhone")]; assert devices, "No available iPhone simulator"; print(devices[0]["udid"])')"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/onair-ios/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$DEVICE_ID" dev.eplus.onair
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/onair-ios-simulator.png"
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: onair-ios-simulator
          path: ${{ runner.temp }}/onair-ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onair-ios-screenshot
          path: ${{ runner.temp }}/onair-ios-simulator.png
          if-no-files-found: ignore
          retention-days: 7
