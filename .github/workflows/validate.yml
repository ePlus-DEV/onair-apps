name: Validate application scaffold
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - run: npm ci
      - run: npm run check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run app validation tests
        working-directory: frontend
        run: npm run test:app
      # Verify Capacitor discovers both native projects and copies a local bundle.
      # This smoke test does not build an APK or validate the real web UI.
      - run: mkdir -p dist/web && printf '<!doctype html><title>Smoke test</title>' > dist/web/index.html
      - run: npx cap sync android
      - run: npx cap copy ios
      - run: node -e "const fs=require('fs'); for(const p of ['capacitor.config.json','apps/desktop/src-tauri/tauri.conf.json','docs/ARCHITECTURE.md']) if(!fs.existsSync(p)) process.exit(1)"
