name: Android debug build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: onair-apps
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            onair-apps/package-lock.json
            onair-apps/frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify Android SDK
        run: test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME/platforms"
      - name: Install web dependencies
        working-directory: onair-apps/frontend
        run: npm ci
      - name: Install app dependencies
        working-directory: onair-apps
        run: npm ci
      - name: Test radio app features
        working-directory: onair-apps/frontend
        run: npm run test:app
      - name: Build and copy web bundle
        working-directory: onair-apps
        env:
          NUXT_PUBLIC_CORS_SERVER_1: ${{ vars.NUXT_PUBLIC_CORS_SERVER_1 }}
          NUXT_PUBLIC_GLOBAL_RADIO_RESOLVER_URL: ${{ vars.NUXT_PUBLIC_GLOBAL_RADIO_RESOLVER_URL }}
          NUXT_PUBLIC_API_ZING_LIVE_STREAM_PROGRAM_DETAIL: ${{ vars.NUXT_PUBLIC_API_ZING_LIVE_STREAM_PROGRAM_DETAIL }}
          NUXT_PUBLIC_API_ZING_GET_LYRIC: ${{ vars.NUXT_PUBLIC_API_ZING_GET_LYRIC }}
        run: npm run sync:web
      - name: Sync Android project
        working-directory: onair-apps
        run: npx cap sync android
      - name: Build debug APK
        working-directory: onair-apps/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: onair-android-debug
          path: onair-apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: onair-android-instrumentation
          path: onair-apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onair-android-debug
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: onair-android-instrumentation
          path: apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Android application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apk/app-debug.apk
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell am start -W -n dev.eplus.onair/.MainActivity
            sleep 20
            adb shell pidof dev.eplus.onair
            adb shell uiautomator dump /sdcard/onair-window.xml
            adb shell cat /sdcard/onair-window.xml > /tmp/onair-window.xml
            if grep -q "Pixel Launcher isn't responding" /tmp/onair-window.xml; then adb shell input tap 160 330; adb shell am force-stop com.google.android.apps.nexuslauncher; adb shell am start -W -n dev.eplus.onair/.MainActivity; sleep 5; adb shell uiautomator dump /sdcard/onair-window.xml; adb shell cat /sdcard/onair-window.xml > /tmp/onair-window.xml; fi
            cp /tmp/onair-window.xml "$GITHUB_WORKSPACE/onair-window.xml"
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/onair-emulator.png"
            adb logcat -d -t 4000 | grep -E 'chromium|Capacitor|dev.eplus.onair|AndroidRuntime' > "$GITHUB_WORKSPACE/onair-logcat.txt" || true
            adb install -r apk/app-debug-androidTest.apk
            adb shell am instrument -w -e class dev.eplus.onair.RadioPlaybackServiceTest#mediaSessionPlaysAndPauses dev.eplus.onair.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/onair-audio.txt
            adb shell am instrument -w -e class dev.eplus.onair.RadioPlaybackServiceTest#playsHlsFromHttpStream dev.eplus.onair.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/onair-hls.txt
            adb shell input keyevent 224
            adb shell input keyevent 82
            adb shell am instrument -w -e class dev.eplus.onair.RadioPlaybackServiceTest#webViewRendersHome dev.eplus.onair.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/onair-home.txt
            adb logcat -d -t 12000 > "$GITHUB_WORKSPACE/onair-test-logcat.txt"
            grep -Eq 'OK \([0-9]+ test' /tmp/onair-audio.txt
            grep -Eq 'OK \([0-9]+ test' /tmp/onair-hls.txt
            grep -Eq 'OK \([0-9]+ test' /tmp/onair-home.txt
      - name: Save emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onair-emulator-screenshot
          path: |
            onair-emulator.png
            onair-window.xml
            onair-logcat.txt
            onair-test-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
