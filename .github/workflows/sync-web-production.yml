name: Sync web production to app
on:
  repository_dispatch:
    types: [web-main-updated]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: web-production-sync
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read web main
        run: git clone --filter=blob:none --no-checkout https://github.com/ePlus-DEV/radio.eplus.dev.git upstream-web
      - name: Reconcile changes
        id: reconcile
        run: |
          set -euo pipefail
          head="$(git -C upstream-web rev-parse origin/main)"
          base="$(tr -d '\n' < sync/web-main-base.txt)"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" = "$base" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          branch="sync/web-main-$head"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 scripts/sync-web-production.py
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.reconcile.outputs.changed == 'true'
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Validate proposed changes
        if: steps.reconcile.outputs.changed == 'true'
        run: |
          npm ci
          npm run check
          cd frontend
          npm ci
          npm run test:app
      - name: Create draft PR
        if: steps.reconcile.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_HEAD: ${{ steps.reconcile.outputs.head }}
        run: |
          set -euo pipefail
          git switch -c "sync/web-main-$WEB_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- frontend/public/radio frontend/components frontend/composables frontend/stores frontend/utils frontend/pages frontend/lang frontend/assets sync
          git commit -m "sync: propose web production changes"
          git push origin "sync/web-main-$WEB_HEAD"
          gh pr create --base main --head "sync/web-main-$WEB_HEAD" --draft --title "Sync web main ${WEB_HEAD:0:7}" --body "Review sync/web-review.md. Checkpoint advances only after a conflict-free PR is merged. Root and frontend validation ran in the sync workflow; GitHub Actions PR events generated by GITHUB_TOKEN do not start another workflow. Native builds remain manual."
